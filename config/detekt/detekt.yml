#
# Builds upon the default config from the Detekt 2.x plugin line.
# Compose-bearing modules also load io.nlopez.compose.rules via detektPlugins.
#
style:
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
    excludePackageStatements: true
    excludeImportStatements: true
  WildcardImport:
    active: true
  ThrowsCount:
    active: false
  ReturnCount:
    max: 8
  # Specimens are made of layout fractions, spring snaps, and easing points.
  MagicNumber:
    active: false

complexity:
  LongParameterList:
    active: false
  ComplexCondition:
    allowedConditions: 5
  CyclomaticComplexMethod:
    allowedComplexity: 18
    ignoreAnnotated:
      - "Composable"
  LongMethod:
    active: true
    allowedLines: 80
    ignoreAnnotated:
      - "Composable"
  TooManyFunctions:
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 20
    allowedFunctionsPerObject: 20
    allowedFunctionsPerInterface: 20
  NestedBlockDepth:
    allowedDepth: 5

naming:
  FunctionNaming:
    ignoreAnnotated:
      - "Composable"
