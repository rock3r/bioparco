name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Records a branch and publishes the README media of the named specimens only, e.g. to seed
  # a new specimen's stable URLs before its README links go live.
  workflow_dispatch:
    inputs:
      specimens:
        description: "Specimens whose README media to publish, space-separated (e.g. new-specimen)"
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: PR watcher tests
        run: python3 -m unittest discover -s .agents/skills/babysit-pr/scripts -p 'test_*.py'
      - run: ./gradlew check

  recordings:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      STATIC_UPLOAD_TOKEN: ${{ secrets.STATIC_UPLOAD_TOKEN }}
      # Manual runs publish only these; pushes to main and tags publish every specimen.
      PUBLISH_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.specimens || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Xvfb and GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            x11-utils \
            ffmpeg webp
      - name: Record specimens
        run: xvfb-run -a ./gradlew :recordings:recordSpecimens
      - name: Build README previews
        run: recordings/previews/make-previews.sh recordings/build/recordings
      - name: Publish README media
        # Overwrites https://static.sebastiano.dev/stable/bioparco/<specimen>.{webp,mp4}, which the
        # READMEs link. The edge serves the previous file for at most 60 seconds afterwards.
        run: |
          set -euo pipefail
          if [ -z "${STATIC_UPLOAD_TOKEN}" ]; then
            echo "STATIC_UPLOAD_TOKEN is not set; the README media cannot be published." >&2
            exit 1
          fi
          upload() {
            curl -sS --fail-with-body -X POST https://static.sebastiano.dev/upload \
              -H "Authorization: Bearer ${STATIC_UPLOAD_TOKEN}" \
              -H "Content-Type: $2" \
              -H "X-Asset-Visibility: public" \
              -H "X-Asset-Owner: rock3r" \
              -H "X-Asset-Repo: bioparco" \
              -H "X-Asset-Stable-Name: $3" \
              --data-binary "@$1"
            echo
          }
          dir=recordings/build/recordings
          if [ -n "${PUBLISH_ONLY}" ]; then
            names=()
            for name in ${PUBLISH_ONLY}; do
              if [[ ! "$name" =~ ^[a-z0-9_-]+$ ]] || [ ! -f "$dir/$name.mp4" ]; then
                echo "Unknown specimen: $name" >&2
                exit 1
              fi
              names+=("$name")
            done
          else
            names=()
            for movie in "$dir"/*.mp4; do names+=("$(basename "$movie" .mp4)"); done
          fi
          for name in "${names[@]}"; do
            upload "$dir/$name.webp" image/webp "$name"
            upload "$dir/$name.mp4" video/mp4 "$name"
          done
      - name: Upload recordings release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir=recordings/build/recordings
          shopt -s nullglob
          files=("$dir"/*.mp4)
          echo "Recorded MP4s:"
          ls -la "$dir"
          if [ ${#files[@]} -eq 0 ]; then
            echo "No MP4s under $dir — nothing to publish." >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 1000 ]; then
              echo "Empty or tiny MP4: $f ($size bytes)" >&2
              exit 1
            fi
          done
          gh release view recordings >/dev/null || gh release create recordings \
            --title "specimen recordings" \
            --notes "Auto-generated by the recordings job (xvfb-run ./gradlew :recordings:recordSpecimens). The READMEs link copies on static.sebastiano.dev/stable/bioparco/."
          for f in "${files[@]}"; do
            gh release delete-asset recordings "$(basename "$f")" --yes || true
          done
          gh release upload recordings "${files[@]}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            gh release view "$tag" >/dev/null || gh release create "$tag" \
              --title "$tag" \
              --notes "bioparco $tag. The floating recordings release holds the latest MP4s."
            for f in "${files[@]}"; do
              gh release delete-asset "$tag" "$(basename "$f")" --yes || true
            done
            gh release upload "$tag" "${files[@]}"
          fi
      - name: Publish recordings-assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir=recordings/build/recordings
          shopt -s nullglob
          files=("$dir"/*.mp4)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No MP4s under $dir — nothing to publish to recordings-assets." >&2
            exit 1
          fi
          # Stable raw.githubusercontent.com URLs. They download (octet-stream); they do not play inline.
          # Bearer extraheaders are ignored by git-over-HTTPS; git then prompts
          # for a username and dies with exit 128. Use gh as the credential helper.
          work=$(mktemp -d)
          git init "$work"
          git -C "$work" checkout -b recordings-assets
          mkdir -p "$work/media"
          cp "${files[@]}" "$work/media/"
          printf '%s\n' 'Generated by the recordings CI job. Do not edit by hand.' > "$work/README.md"
          git -C "$work" add media README.md
          git -C "$work" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Refresh specimen recordings"
          git -C "$work" remote add origin \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$work" \
            -c credential.helper= \
            -c credential.helper='!gh auth git-credential' \
            push -f origin HEAD:recordings-assets
