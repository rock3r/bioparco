name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check

  recordings:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Find stale specimens
        id: stale
        run: |
          set -euo pipefail
          stale="$(./gradlew -q :recordings:printStaleSpecimens | tail -n 1)"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          if [ -z "$stale" ]; then
            echo "All specimen fingerprints match recordings/published.json — nothing to record."
          else
            echo "Stale specimens: $stale"
          fi
      - name: Install Xvfb and GStreamer
        if: steps.stale.outputs.stale != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            x11-utils
      - name: Record stale specimens
        if: steps.stale.outputs.stale != ''
        env:
          BIOPARCO_RECORD_ONLY: ${{ steps.stale.outputs.stale }}
        run: xvfb-run -a ./gradlew :recordings:recordSpecimens
      - name: Upload stale movies and refresh README
        if: steps.stale.outputs.stale != ''
        env:
          PR_ASSET_UPLOAD_TOKEN: ${{ secrets.PR_ASSET_UPLOAD_TOKEN }}
          PR_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${PR_ASSET_UPLOAD_TOKEN:-}" ]; then
            echo "PR_ASSET_UPLOAD_TOKEN is not set; cannot host README movies." >&2
            exit 1
          fi
          dir=recordings/build/recordings
          IFS=',' read -r -a specimens <<< "${{ steps.stale.outputs.stale }}"
          for specimen in "${specimens[@]}"; do
            file="$dir/${specimen}.mp4"
            size=$(wc -c < "$file")
            if [ "$size" -lt 1000 ]; then
              echo "Empty or tiny MP4: $file ($size bytes)" >&2
              exit 1
            fi
            response="$(curl -sS -X POST "https://static.sebastiano.dev/upload" \
              -H "Authorization: Bearer ${PR_ASSET_UPLOAD_TOKEN}" \
              -H "Content-Type: video/mp4" \
              -H "X-Asset-Visibility: public" \
              -H "X-Asset-Owner: rock3r" \
              -H "X-Asset-Repo: bioparco" \
              -H "X-Asset-Pr: ${PR_NUMBER}" \
              -H "X-Asset-Name: ${specimen}" \
              --data-binary @"$file")"
            url="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])')"
            ./gradlew -q :recordings:publishSpecimen -Pspecimen="$specimen" -Purl="$url"
          done
          ./gradlew -q :recordings:writeReadmeEnclosures
          git add README.md recordings/published.json \
            grabby-stepper/README.md chat-bubble-transition/README.md processing-field/README.md
          if git diff --cached --quiet; then
            echo "Upload produced no tracked changes."
            exit 0
          fi
          git \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish updated specimen recordings"
          git push origin HEAD:main
