name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check

  recordings:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Xvfb and GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            x11-utils
      - name: Record specimens
        run: xvfb-run -a ./gradlew :recordings:recordSpecimens
      - name: Upload recordings release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir=recordings/build/recordings
          shopt -s nullglob
          files=("$dir"/*.mp4)
          echo "Recorded MP4s:"
          ls -la "$dir"
          if [ ${#files[@]} -eq 0 ]; then
            echo "No MP4s under $dir — nothing to publish to the README links." >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 1000 ]; then
              echo "Empty or tiny MP4: $f ($size bytes)" >&2
              exit 1
            fi
          done
          gh release view recordings >/dev/null || gh release create recordings \
            --title "specimen recordings" \
            --notes "Auto-generated by the recordings job (xvfb-run ./gradlew :recordings:recordSpecimens). README videos download these assets."
          for f in "${files[@]}"; do
            gh release delete-asset recordings "$(basename "$f")" --yes || true
          done
          gh release upload recordings "${files[@]}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            gh release view "$tag" >/dev/null || gh release create "$tag" \
              --title "$tag" \
              --notes "bioparco $tag. README videos stay on the floating recordings release."
            for f in "${files[@]}"; do
              gh release delete-asset "$tag" "$(basename "$f")" --yes || true
            done
            gh release upload "$tag" "${files[@]}"
          fi
          # README embeds need raw.githubusercontent.com (video/mp4, not attachment).
          work=$(mktemp -d)
          git init "$work"
          git -C "$work" checkout -b recordings-assets
          mkdir -p "$work/media"
          cp "${files[@]}" "$work/media/"
          printf '%s\n' 'Generated by the recordings CI job. Do not edit by hand.' > "$work/README.md"
          git -C "$work" add media README.md
          git -C "$work" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Refresh specimen recordings"
          git -C "$work" remote add origin \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$work" \
            -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
            push -f origin HEAD:recordings-assets
