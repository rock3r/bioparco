name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check

  recordings:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Xvfb and GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            x11-utils
      - name: Record specimens
        run: xvfb-run -a ./gradlew :recordings:recordSpecimens
      - name: Upload recordings release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir=recordings/build/recordings
          shopt -s nullglob
          files=("$dir"/*.mp4)
          echo "Recorded MP4s:"
          ls -la "$dir"
          if [ ${#files[@]} -eq 0 ]; then
            echo "No MP4s under $dir — nothing to publish to the README links." >&2
            exit 1
          fi
          gh release view recordings >/dev/null || gh release create recordings \
            --title "specimen recordings" \
            --notes "Auto-generated by the main-branch recordings job (xvfb-run ./gradlew :recordings:recordSpecimens). README links download these assets."
          for f in "${files[@]}"; do
            gh release delete-asset recordings "$(basename "$f")" --yes || true
          done
          gh release upload recordings "${files[@]}"
