name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check

  recordings:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Xvfb and GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly \
            x11-utils
      - name: Record specimens
        run: xvfb-run -a ./gradlew :recordings:recordSpecimens
      - name: Upload recordings release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view recordings || gh release create recordings \
            --title "specimen recordings" \
            --notes "Auto-generated by ./gradlew :recordings:recordSpecimens under xvfb-run."
          gh release upload recordings \
            recordings/build/recordings/grabby-stepper.mp4 \
            recordings/build/recordings/chat-bubble-transition.mp4 \
            --clobber
